name: Validate Gölgedeki Miras

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/game-art-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Mobile browser smoke tests
        run: npm run test:e2e
